[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-new"
version = "0.3.0"
description = "Lightweight image-side trajectory probe for WAM evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
perception = [
  "transformers>=4.40",
  "Pillow>=10.0",
]

[project.scripts]
iac-image-eval = "iac_new.evaluate:main"
iac-image-calibrate = "iac_new.calibrate:main"
iac-image-check-splits = "iac_new.check_splits:main"

[tool.setuptools.packages.find]
where = ["src"]
